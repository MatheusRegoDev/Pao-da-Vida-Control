# Configuração padrão (comum a todos os perfis)
spring:
  application:
    name: Pao-da-Vida
  profiles:
    active: test
  jpa:
    open-in-view: false

---

# Perfil de testes: usa banco H2 em memória
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
