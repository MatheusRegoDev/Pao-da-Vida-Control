spring:
  application:
    name: Pao-da-Vida

  profiles:
    active: dev
  
  config:
    import: optional:file:.env[.properties], optional:file:../../.env[.properties]

  jpa:
    open-in-view: false

jwt:
  expiration: ${JWT_EXPIRATION}
  key: ${JWT_KEY}

admin:
  name: ${ADMIN_NAME}
  email: ${ADMIN_EMAIL}
  password: ${ADMIN_PASS}

frontend:
  url: ${FRONTEND_URL}

---

spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

---

spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5432}/${POSTGRESDB_NAME}
    username: ${POSTGRESDB_USER}
    password: ${POSTGRESDB_PASS}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true